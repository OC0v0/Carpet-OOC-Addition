plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

def carpetJar = file("libs/fabric-carpet-1.21.11-1.4.194+v251223.jar")
if (!carpetJar.exists()) {
    throw new GradleException(
            "Missing ${carpetJar.name}. Download the Carpet 1.4.194 jar for Minecraft 1.21.11 " +
            "and put it into libs/ (see libs/README.md); it is only used to compile against Carpet's API.")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Carpet is provided by the server at runtime; only needed to compile against its extension API.
    modCompileOnly files("libs/fabric-carpet-1.21.11-1.4.194+v251223.jar")
    // Client-only: built-in resource pack registration (resource loader API) and the beacon label mixin.
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
