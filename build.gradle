plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Carpet (https://github.com/gnembon/fabric-carpet) is published to Modrinth's public Maven.
    maven {
        url = uri("https://api.modrinth.com/maven")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Carpet is provided by the server at runtime; only needed to compile against its extension API.
    modCompileOnly "maven.modrinth:carpet:${project.carpet_version}"
    // Client-only: built-in resource pack registration (resource loader API) and the beacon label mixin.
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
